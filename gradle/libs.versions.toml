[versions]
revanced-patcher = "22.0.0"
# Tracking https://github.com/google/smali/issues/64.
#noinspection GradleDependency
smali = "3.0.8"
agp = "8.2.2"
annotation = "1.9.1"
appcompat = "1.7.1"
